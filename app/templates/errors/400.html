{% extends "base.html" %}

{% block title %}Bad Request (400) — TrustVault{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center;">
  <div class="auth-card" style="padding: 3rem 2rem;">
    <div style="width: 56px; height: 56px; margin: 0 auto 1.5rem auto; border-radius: var(--radius-md); background: var(--warning-bg); border: 1px solid var(--warning-border); display: flex; align-items: center; justify-content: center; color: var(--warning);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h1 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary); letter-spacing: -0.02em;">400 &mdash; Bad Request</h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.6;">
      The request contained invalid parameters or expired CSRF security tokens.
    </p>
    <a href="{{ url_for('documents.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
