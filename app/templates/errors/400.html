{% extends "base.html" %}

{% block title %}Bad Request (400) — TrustVault{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 1.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--warning);">400 — Bad Request</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
      The request could not be understood or contained invalid security tokens (e.g. expired CSRF token).
    </p>
    <a href="{{ url_for('documents.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
