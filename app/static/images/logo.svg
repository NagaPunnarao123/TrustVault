<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tv-emerald-grad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tv-core-grad" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tv-glow-grad" x1="24" y1="10" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="tv-glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Isometric Vault Shield -->
  <path d="M24 4L40 11.5V23.2C40 33.1 33.2 41.8 24 44.5C14.8 41.8 8 33.1 8 23.2V11.5L24 4Z" 
        fill="#0A1016" 
        stroke="url(#tv-emerald-grad)" 
        stroke-width="2.2" 
        stroke-linejoin="round"/>

  <!-- Inner Cryptographic Geometry -->
  <path d="M24 10L35 15.5V23C35 30.5 30.3 37.2 24 39.5C17.7 37.2 13 30.5 13 23V15.5L24 10Z" 
        fill="url(#tv-core-grad)" 
        stroke="#10B981" 
        stroke-width="1.2" 
        stroke-opacity="0.4"
        stroke-dasharray="3 2"/>

  <!-- Isometric Vault Center Core (Hexagon Lock) -->
  <polygon points="24,17 31,21 31,29 24,33 17,29 17,21" 
           fill="#0E1620" 
           stroke="url(#tv-glow-grad)" 
           stroke-width="1.8" 
           stroke-linejoin="round"/>

  <!-- Radial Vault Locking Bolt Beams -->
  <line x1="24" y1="17" x2="24" y2="12" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31" y1="21" x2="35" y2="19" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31" y1="29" x2="35" y2="31" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="33" x2="24" y2="38" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="29" x2="13" y2="31" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="21" x2="13" y2="19" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Quantum Key / Core Spark -->
  <circle cx="24" cy="25" r="3.2" fill="#34D399"/>
  <circle cx="24" cy="25" r="1.5" fill="#FFFFFF"/>
</svg>
